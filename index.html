    <div class="app-container" id="appContainer">

            <div id="mainOverlay">
                <div id="mobileTopMenu" class="mobile-only-menu" style="display: none;">
                    <select id="mobileLessonSelect" onchange="syncMobileMenu()">

                        <option value="1">Lesson 1</option><option value="2">Lesson 2</option><option value="3">Lesson 3</option><option value="4">Lesson 4</option><option value="5">Lesson 5</option>

                    <select id="mobilePartSelect" onchange="syncMobileMenu()">

                    </select>
                    <select id="mobileParaSelect" onchange="syncMobileMenu()">
                        <option value="" selected disabled>段落を選択</option>
                        <option value="full">Full Text</option><option value="p1">Para 1</option><option value="p2">Para 2</option><option value="p3">Para 3</option>

                </div>

<nav class="po-learning-menu po-mobile-actions" aria-label="4ステップ学習メニュー">
  <div class="po-step-grid">
    <div class="po-step po-step-watch">
      <button type="button" class="po-step-primary" onclick="PowerOnPractice.openTheater()"><span class="po-step-num">1</span><span class="po-step-copy"><strong>Watch &amp; Listen</strong><small>Story Theater · 本文を聞く</small></span></button>
    </div>
    <div class="po-step po-step-read">
      <button type="button" class="po-step-primary" onclick="PowerOnPractice.open('sceneReading')"><span class="po-step-num">2</span><span class="po-step-copy"><strong>Read &amp; Practice</strong><small>1シーンずつ音読する</small></span></button>
    </div>
    <div class="po-step po-step-play">
      <button type="button" class="po-step-primary" onclick="PowerOnPractice.launchStory()"><span class="po-step-num">3</span><span class="po-step-copy"><strong>Play &amp; Challenge</strong><small>Story Match · いつもの4モード</small></span></button>
    </div>
    <div class="po-step po-step-check">
      <button type="button" class="po-step-primary" onclick="PowerOnCourses.launchChallenge()"><span class="po-step-num">4</span><span class="po-step-copy"><strong>Check Understanding</strong><small>語彙 → 日本語 → English · 全問正解</small></span></button>
    </div>
  </div>
  <div class="po-menu-label po-quick-label"><span>教材・学習記録</span></div>
  <div class="po-quick-grid">
    <button type="button" onclick="toggleTextMode('script')"><span aria-hidden="true">▤</span> Script<small>本文</small></button>
    <button type="button" onclick="toggleTextMode('japanese')"><span aria-hidden="true">文</span> Japanese<small>和訳</small></button>
    <button type="button" class="po-progress-link" onclick="PowerOnPractice.open('progress')"><span aria-hidden="true">◉</span> My Progress<small>学習記録</small></button>
    <button type="button" class="po-screen-reset" onclick="resetAppMode()" title="画面を閉じます。記録は消えません。"><span aria-hidden="true">↺</span> 画面を閉じる</button>
  </div>
</nav>

                <div class="overlay-header" id="windowHeader" style="display:flex; justify-content:space-between; align-items:center; width:100%; border-bottom: none;">

                </div>
                
                <div id="fontControls" style="display:none; justify-content:flex-end; width:100%; margin-bottom:10px; gap: 15px;">
                    <div style="display:none; align-items:center; gap: 8px;" id="engFontControl">
                        <button class="font-size-btn" onclick="changeFontSize('eng', -2)">A -</button>
                        <button class="font-size-btn" onclick="changeFontSize('eng', 2)">A +</button>
                    </div>
                </div>

                <div class="target-text-display sns-box" id="targetTextDisplay" style="display: none;">※データがありません</div>

                <div id="speechResultWindow" style="display:none; flex-grow: 1; flex-direction: column; width: 100%; height: 100%;">
                    <div id="gameHud" class="game-hud">
                        <div class="hud-badge hud-acc">
                            <span class="hud-title">ACCURACY</span>
                            <span class="hud-value" id="hudAccValue">0<span style="font-size:1rem;">%</span></span>
                        </div>
                        <div class="hud-badge hud-wpm">
                            <span class="hud-title">WPM</span>
                            <span class="hud-value" id="hudWpmValue">0</span>
                        </div>
                        <div style="color: #ffffff; font-size: 10px !important; margin-left: auto; white-space: nowrap; font-weight: normal;">※読めた単語は<span style="color:#4facfe; font-weight:bold;">青色</span></div>
                    </div>
                    
                    <div class="transcription-container">
                        <div id="mobileGuideMessage" class="mobile-guide-msg" style="display: none;">
                            <div style="font-size:3.5rem; margin-bottom:15px; animation: bounce 1s infinite;">👆</div>
                            <div style="color:#0095f6; font-weight:900; font-size:1.1rem; text-align:center; line-height:1.6; background:#f0f8ff; padding:20px; border-radius:12px; border:2px dashed #a1c4fd; width:90%; box-shadow: 0 4px 15px rgba(0,149,246,0.15);">
                                Lesson<br>Part<br>段落<br><span style="color:#ff4081; font-size:0.9rem;">すべてを選択してください</span>
                            </div>
                        </div>

                        <div class="recognized-text sns-box-large" id="recognizedTextDisplay"></div>
                        
                        <div id="readingMicContainer" style="display:none;">
                            <button class="start-record-btn floating-btn" id="micBtn" onclick="toggleReadingRecording()">START</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="vocabPopup" style="display:none;">
                <div class="popup-word" id="popupWord">Word</div>
                <div class="popup-pron" id="popupPron">/pron/</div>
                <div class="popup-mean" id="popupMean">意味</div>
                <div class="popup-recognized" id="popupRecognized">認識: </div>
                <div class="popup-controls">
                    <button class="popup-mic-btn" id="popupMicBtn" onclick="togglePopupMic()">🎤</button>
                    <button class="popup-close" onclick="closeVocabPopup()">閉じる</button>
                </div>
            </div>
        </div>

        <div id="drag-handle"></div>

        <div class="sidebar compact-sidebar" id="sidebar">
            <!-- Internal scope controls remain in DOM for lessons, quizzes, and audio; one user-facing Part picker lives in Script/Courses. -->

                <select id="partSelect" onchange="onScopeChange()" tabindex="-1"><option value="1">Part 1</option></select>
                <select id="paraSelect" onchange="onScopeChange()" tabindex="-1"><option value="full">Full Text</option></select>
                <select id="levelSelect" onchange="changeLevel(this.value)" tabindex="-1">
                    <option value="standard">Standard</option><option value="pre1">準1級</option><option value="grade1">1級</option>
                </select>
                <button type="button" id="btnMainAudio" tabindex="-1" aria-hidden="true" onclick="toggleMainAudio()">▶ Play Audio</button>
            </div>

    <div id="submitModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:30px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 4px 15px rgba(0,0,0,0.2); text-align:center;">
            <h3 style="margin-top:0; color:#333;">📤 成績の提出</h3>
            <p style="font-size:0.9rem; color:#666; margin-bottom:10px;">ベストスコアを先生に送信します。</p>
            <div style="background:#fff9c4; padding:8px; border-radius:6px; margin-bottom:15px; font-size:0.9rem; font-weight:bold; color:#f57f17;">
                📍 練習範囲: <span id="submitScopeDisplay">未取得</span>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="studentClass" placeholder="クラス (例: 1A)" style="width:50%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px;">
                <input type="number" id="studentNumber" placeholder="出席番号" style="width:50%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px;">
            </div>
            <input type="text" id="studentName" placeholder="氏名 (フルネーム)" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:16px; margin-bottom:20px; box-sizing:border-box;">
            <div style="background:#f0f8ff; padding:15px; border-radius:8px; margin-bottom:20px;">
                <div style="font-weight:bold; color:#0288d1; margin-bottom:5px;">送信するデータ</div>
                <div style="display:flex; justify-content:space-around; font-size:1.2rem; font-weight:900; color:#333;">
                    <div>Accuracy: <span id="submitAcc">0</span>%</div>
                    <div>WPM: <span id="submitWpm">0</span></div>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="document.getElementById('submitModal').style.display='none'" style="flex:1; padding:12px; border:none; border-radius:6px; background:#e0e0e0; color:#333; font-weight:bold; cursor:pointer;">キャンセル</button>
                <button onclick="if(typeof sendScoreToGAS === 'function'){ sendScoreToGAS(); } else { alert('送信機能が未定義です'); }" id="finalSubmitBtn" style="flex:2; padding:12px; border:none; border-radius:6px; background:#4caf50; color:#fff; font-weight:bold; cursor:pointer;">このスコアで送信する</button>
            </div>
        </div>
    </div>

    <button id="floatingSubmitBtn" onclick="openCustomSubmitModal()" style="display:none; position:fixed; bottom:25px; right:15px; background:#ff4081; color:white; border:none; border-radius:50px; padding:10px 15px; font-size:0.9rem; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.3); cursor:pointer; z-index:99999; white-space:nowrap;">
        📤 成績提出
    </button>
